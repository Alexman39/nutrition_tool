<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nutrition Plan Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="control-panel">
      <div class="panel-head">
        <div class="eyebrow">Internal Tool</div>
        <h1>Nutrition Plan Generator</h1>
        <p>Paste the raw Greek nutrition plan, generate preview, and download a clean PNG.</p>
      </div>

      <form id="planForm" class="form-stack">
        <div class="field">
          <label for="athleteName">Athlete Name</label>
          <input id="athleteName" type="text" placeholder="e.g. Γιώργος Βενέτος" />
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="goal">Goal</label>
            <input id="goal" type="text" placeholder="e.g. Σωματική Βελτίωση / Απόδοση" />
          </div>

          <div class="field">
            <label for="planType">Duration / Plan Type</label>
            <input id="planType" type="text" placeholder="e.g. Nutrition Plan" />
          </div>
        </div>

        <div class="field">
          <label for="rawText">Raw Nutrition Text</label>
          <textarea id="rawText" rows="18" placeholder="Paste the raw nutrition text here..."></textarea>
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Generate Preview</button>
          <button type="button" id="downloadBtn" class="btn btn-dark">Download PNG</button>
          <button type="button" id="resetBtn" class="btn btn-light">Reset</button>
        </div>

        <details class="debug-toggle">
          <summary>Debug</summary>
          <pre id="debugOutput" class="debug-box"></pre>
        </details>
      </form>
    </aside>

    <main class="preview-panel">
      <div class="preview-topbar">
        <div>
          <div class="eyebrow">Live Preview</div>
          <h2>Export Scene</h2>
        </div>
        <div class="preview-note">PNG download uses this exact layout and styling.</div>
      </div>

      <div class="preview-stage-shell">
        <div class="preview-scale-wrap">
          <div id="previewMount"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- hidden full-resolution export scene -->
  <div class="export-hidden-area" aria-hidden="true">
    <div id="exportMount"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
